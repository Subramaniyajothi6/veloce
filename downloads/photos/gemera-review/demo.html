<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemera page demo — 5 variants — VELOCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0a0a0b; --coal:#070708; --panel:#101012; --cream:#f2f1ec;
    --ash:#8e8d86; --veloce:#e10600; --line:rgba(255,255,255,.09);
    --accent:var(--veloce);
    --display:'Anton',Impact,'Arial Narrow',sans-serif;
    --body:'Manrope',system-ui,sans-serif;
    --mono:'Space Grotesk','Segoe UI',monospace;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--night);color:var(--cream);font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
  img{display:block;max-width:100%}
  h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1;letter-spacing:.015em}
  .wrap{max-width:1320px;margin:0 auto;padding:0 clamp(1.25rem,4.5vw,3rem)}
  ::selection{background:var(--accent);color:#fff}

  /* variant switcher */
  .switch{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;gap:2px;
    background:#000c;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:9px clamp(1rem,3vw,2rem);align-items:center;flex-wrap:wrap}
  .switch .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ash);margin-right:8px}
  .switch button{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--ash);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;
    transition:.25s;white-space:nowrap}
  .switch button:hover{color:var(--cream);border-color:#ffffff44}
  .switch button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .switch button.on.gold{color:#0a0a0b}

  /* hero */
  .hero{position:relative;height:88vh;min-height:560px;overflow:hidden;display:flex;align-items:flex-end}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
  .hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,8,.55) 0%,transparent 26%,transparent 46%,rgba(7,7,8,.9) 100%)}
  .hero-inner{position:relative;width:100%;padding-bottom:clamp(2.5rem,6vw,5rem)}
  .hero-title{font-size:clamp(4rem,15vw,12rem);letter-spacing:.01em}
  .hero-title .dot{color:var(--accent)}
  .hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:2rem;flex-wrap:wrap;margin-top:1.4rem}
  .tagline{font-size:clamp(1.05rem,2.2vw,1.5rem);color:var(--cream);max-width:34rem}
  .price{font-family:var(--mono);font-size:.85rem;letter-spacing:.14em;color:var(--ash)}
  .price b{color:var(--cream);font-weight:600}

  /* shared bits */
  .eyebrow{display:inline-flex;align-items:center;gap:.9rem;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--ash)}
  .eyebrow b{color:var(--accent);font-weight:600}
  .eyebrow::after{content:"";width:3rem;height:1px;background:var(--accent)}
  .h2{font-size:clamp(2.6rem,6.5vw,4.8rem);margin-top:1.2rem}
  .outline{color:transparent;-webkit-text-stroke:2px var(--cream)}
  .sec{padding:clamp(4.5rem,10vw,8rem) 0}
  .sec-top{display:flex;align-items:flex-end;justify-content:space-between;gap:3rem;margin-bottom:clamp(2.5rem,6vw,4rem);flex-wrap:wrap}
  .sec-top p{max-width:30rem;color:var(--ash)}
  .btn{display:inline-flex;align-items:center;gap:.7rem;background:var(--accent);color:#fff;
    font-family:var(--mono);font-size:.78rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    padding:1.05rem 2.1rem;border-radius:2px;text-decoration:none;transition:.3s}
  .btn.gold{color:#0a0a0b}
  .btn:hover{filter:brightness(1.12)}

  /* overview */
  .overview{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(2.5rem,6vw,5rem);align-items:center}
  .overview .photo{aspect-ratio:4/3;overflow:hidden;background:var(--panel)}
  .overview .photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .overview .cta{display:flex;align-items:center;gap:1.6rem;margin-top:2.5rem;flex-wrap:wrap}

  /* highlights */
  .hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,2.5vw,2rem)}
  .hl{position:relative;overflow:hidden;background:var(--panel);min-height:320px;display:flex}
  .hl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85);transition:transform 1.2s var(--ease)}
  .hl:hover img{transform:scale(1.06)}
  .hl .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,rgba(7,7,8,.93))}
  .hl .num{position:absolute;top:1rem;left:1.3rem;font-family:var(--display);font-size:clamp(2rem,4vw,3rem);color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.3)}
  .hl .txt{position:relative;align-self:flex-end;padding:clamp(1.4rem,3vw,2.2rem);z-index:1}
  .hl h3{font-family:var(--body);font-weight:600;text-transform:none;font-size:clamp(1.3rem,2.2vw,1.8rem);color:var(--cream);line-height:1.15}
  .hl p{color:var(--ash);font-size:.92rem;margin-top:.75rem;max-width:34rem}

  /* specs */
  .spec-row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2rem;padding:1.4rem 0;border-bottom:1px solid var(--line)}
  .spec-row:first-child{border-top:1px solid var(--line)}
  .spec-l{display:flex;align-items:baseline;gap:1.5rem;flex-wrap:wrap}
  .spec-idx{font-family:var(--mono);font-size:.62rem;letter-spacing:.3em;color:var(--ash)}
  .spec-lab{font-family:var(--mono);font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  .spec-det{color:var(--ash);font-size:.9rem}
  .spec-val{font-family:var(--mono);font-weight:600;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1;transition:color .3s}
  .spec-row:hover .spec-val{color:var(--accent)}
  .spec-val small{font-size:.55em;color:var(--accent);margin-left:.5rem}

  /* features */
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center;margin-bottom:clamp(2.5rem,6vw,5rem)}
  .feat:nth-child(even) .feat-img{order:2}
  .feat-img{aspect-ratio:4/3;overflow:hidden;background:var(--panel)}
  .feat-img img{width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .feat-idx{font-family:var(--mono);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ash)}
  .feat h3{font-family:var(--body);font-weight:600;text-transform:none;font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.05;margin-top:1rem}
  .feat-stat{display:flex;align-items:baseline;gap:.8rem;margin:1.5rem 0;border-left:2px solid var(--accent);padding-left:1rem}
  .feat-stat b{font-family:var(--mono);font-weight:600;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1;color:var(--cream)}
  .feat-stat span{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ash)}
  .feat p{color:var(--ash);font-size:1.02rem;max-width:34rem}

  /* gallery */
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,3.5vw,3rem)}
  .gal figure{overflow:hidden}
  .gal .ph{aspect-ratio:4/3;overflow:hidden;background:var(--panel)}
  .gal img{width:100%;height:100%;object-fit:cover;filter:saturate(.85);transition:transform 1s var(--ease)}
  .gal figure:hover img{transform:scale(1.05)}
  .gal figcaption{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ash);padding-top:1rem}
  .gal figcaption b{color:var(--accent);margin-right:.5rem}

  /* track */
  .track{background:var(--coal);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .track .wrap{padding:clamp(4rem,9vh,6rem) clamp(1.25rem,4.5vw,3rem)}
  .track-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.5rem,4vw,3rem)}
  .track-item{border-top:2px solid var(--accent);padding-top:1.5rem}
  .track-item .k{font-family:var(--mono);font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--ash)}
  .track-item .v{font-family:var(--mono);font-weight:600;font-size:clamp(2.6rem,5vw,4rem);line-height:1;margin-top:1rem}
  .track-item .n{color:var(--ash);font-size:.9rem;margin-top:1rem}

  /* next */
  .next{display:block;border-top:1px solid var(--line);text-decoration:none;color:var(--cream)}
  .next .wrap{padding:clamp(3rem,7vw,5rem) clamp(1.25rem,4.5vw,3rem);display:flex;align-items:flex-end;justify-content:space-between;gap:2rem}
  .next .eyebrow::after{display:none}
  .next .nm{display:block;font-family:var(--display);text-transform:uppercase;font-size:clamp(2.6rem,7vw,5.5rem);line-height:1;margin-top:1rem;transition:color .3s}
  .next:hover .nm{color:var(--accent)}
  .next .arr{font-family:var(--display);font-size:3rem;transition:transform .4s var(--ease)}
  .next:hover .arr{transform:translateX(10px)}

  .paltag{position:fixed;right:14px;bottom:14px;z-index:100;font-family:var(--mono);font-size:11px;
    letter-spacing:.08em;color:var(--ash);background:#000b;border:1px solid var(--line);border-radius:999px;padding:7px 13px}
  @media(max-width:860px){
    .overview,.hl-grid,.feat,.gal,.track-grid{grid-template-columns:1fr}
    .feat:nth-child(even) .feat-img{order:0}
    .hero{height:74vh}
  }
</style>
</head>
<body>
  <nav class="switch" id="switch">
    <span class="lbl">Gemera page ·</span>
  </nav>

  <main id="page"></main>
  <div class="paltag" id="paltag"></div>

<script>
const IMG = f => `orig/${f}.jpg`;
// per-image crop focus for object-fit:cover (keeps a subject off the crop line)
const POS = {'tg-4668':'25% center'};

// ---- Gemera content (shared across all variants) ----
const C = {
  name: ["Koeni", "gseg", "g Gemera"], // just used as title text below
  title: "Gemera",
  brand: "Koenigsegg",
  category: "Four-Seat Mega-GT",
  price: "€1,700,000",
  tagline: "Four seats. Four hundred km/h. No compromise.",
  desc: "Koenigsegg's first four-seater — a Mega-GT built around a camless 2.0-litre twin-turbo triple and three electric motors. 1,700 hp, a 1.9-second launch, and room for the whole family behind two dihedral doors.",
  specs: [
    {lab:"Combined power", val:"1,700", unit:"HP", det:"600 hp triple plus three electric motors."},
    {lab:"0–100 km/h", val:"1.9", unit:"S", det:"All-wheel drive, launch control."},
    {lab:"Top speed", val:"400", unit:"KM/H", det:"A four-seater that still runs to 400."},
    {lab:"Torque", val:"3,500", unit:"NM", det:"Combined, measured at the wheels."},
    {lab:"Displacement", val:"2.0", unit:"L", det:"Twin-turbo triple, camless Freevalve."},
    {lab:"Cabin", val:"4", unit:"SEATS", det:"Four adults, four sets of luggage."},
  ],
  highlights: [
    {t:"Four seats, no apology", c:"Koenigsegg's first four-seater. Two dihedral synchro-helix doors swing up to a genuine 2+2 cabin — space for the family in a car that runs to 400 km/h."},
    {t:"The Tiny Friendly Giant", c:"A 2.0-litre twin-turbo three-cylinder with no camshafts at all. 600 hp from three cylinders, before the electric motors even join in."},
    {t:"Direct Drive, no gearbox", c:"The Koenigsegg Direct Drive system deletes the conventional gearbox, coupling engine and motors straight to the wheels — seamless and light."},
    {t:"A grand tourer, weaponised", c:"1,700 hp and a 1.9-second launch wrapped around four seats and a boot. The everyday hypercar, made real."},
  ],
  features: [
    {t:"1,700 hp — three cylinders, three motors", stat:["1,700 HP","combined output"], c:"The camless triple drives one axle while three electric motors fill every gap. Power flows to whichever wheel can use it, metered thousands of times a second."},
    {t:"A cabin built around four", stat:["4 SEATS","four full-size adults"], c:"Two synchro-helix doors open onto four sculpted heated seats, four cupholders and four screens — a hypercar you can actually share."},
    {t:"Camless, by design", stat:["0 CAMSHAFTS","Freevalve actuation"], c:"Each valve is opened pneumatically on command, not by a lobe on a shaft. The engine breathes exactly as it needs to — lighter, cleaner, freer-revving."},
    {t:"A titanium voice", stat:["600 HP","from three cylinders"], c:"Behind the cabin, a single round tailpipe vents a lightweight exhaust. The 2.0-litre twin-turbo triple revs hard and sings loud — proof that three cylinders need not be quiet."},
    {t:"Wing mirrors, deleted", stat:["2 CAMERAS","digital side view"], c:"Slim camera stalks replace the door mirrors, feeding two in-cabin screens and shaving drag off the shoulders. A cleaner line, a quieter cabin, sharper aero."},
    {t:"Four screens, four passengers", stat:["4 SCREENS","one for every seat"], c:"Each occupant gets their own display and climate zone, while the centre console floats twin touchscreens above a wireless-charging deck. A hypercar built to be shared."},
  ],
  track: [
    {k:"0–100 km/h", v:"1.9 S", n:"Launch control, all-wheel drive"},
    {k:"Combined range", v:"1000 KM", n:"Petrol plus electric, claimed"},
    {k:"Kerb weight", v:"1850 KG", n:"Four seats included"},
  ],
  gallery: [{cap:"On the move"},{cap:"Down the straight"},{cap:"On the runway"},{cap:"On the stand"}],
  next: "Pagani Huayra",
};

// ---- 5 variants: differ by hero image, palette, accent ----
const V = [
  {id:"best", name:"★ Director's Cut", colorway:"Emerald / Tan — curated best", accent:"#e10600", gold:false,
    hero:"sv-g5", overview:"tg-stand-6",
    hl:["sv-g6","tg-studio-389","tg-runway-159","tg-runway-1"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["tg-runway-157","tg-bahn-359"]},
  {id:"emerald", name:"Emerald · Cinematic", colorway:"Emerald Green / Tan", accent:"#e10600", gold:false,
    hero:"sv-g5", overview:"tg-stand-6",
    hl:["sv-g6","tg-studio-389","tg-runway-159","tg-runway-1"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["tg-runway-157","tg-bahn-359"]},
  {id:"runway", name:"Emerald · Runway Dawn", colorway:"Emerald Green / Runway", accent:"#e10600", gold:false,
    hero:"tg-runway-1", overview:"sv-g5",
    hl:["sv-g6","tg-studio-389","tg-runway-157","tg-runway-2"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["tg-bahn-359","tg-bahn-360"]},
  {id:"factory", name:"Emerald · Factory", colorway:"Emerald / Factory hero", accent:"#e10600", gold:false,
    hero:"tg-factory-5", overview:"sv-g5",
    hl:["sv-g6","tg-studio-389","tg-stand-6","tg-runway-1"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["tg-runway-157","tg-bahn-359"]},
  {id:"silver", name:"Silver · Yellow", colorway:"Silver / Yellow — gold accent", accent:"#d4a017", gold:true,
    hero:"tg-4685", overview:"tg-4668",
    hl:["tg-4662","tg-4947","tg-4671","tg-4660"],
    ft:["tg-4807","tg-4952","tg-5099","sv-6","sv-g3","sv-g4"],
    gal:["kc-3","sv-g1"]},
  {id:"studio", name:"Studio · Light", colorway:"Emerald / Studio white", accent:"#e10600", gold:false,
    hero:"tg-stand-6", overview:"tg-stand-5",
    hl:["tg-stand-3","tg-studio-389","tg-stand-1","tg-stand-2"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["tg-bahn-359","tg-runway-157"]},
  {id:"mix", name:"Grey + Emerald · Blue", colorway:"Grey / Emerald mix — blue accent", accent:"#3b82f6", gold:false,
    hero:"tg-4668", overview:"sv-g5",
    hl:["sv-g6","tg-studio-389","sv-g1","tg-runway-159"],
    ft:["sv-g11","tg-studio-386","tg-studio-392","sv-6","sv-g3","tg-studio-388"],
    gal:["kc-3","tg-bahn-359"]},
  {id:"graphite", name:"Graphite · Mono", colorway:"Full grey — red accent", accent:"#e10600", gold:false,
    hero:"kc-5", overview:"tg-4685",
    hl:["tg-4662","tg-4947","tg-4671","tg-4660"],
    ft:["tg-4807","tg-4952","tg-5099","sv-6","sv-g3","sv-g4"],
    gal:["kc-3","tg-bahn-359","tg-runway-2","tg-4668"]},
];

function render(v){
  document.documentElement.style.setProperty('--accent', v.accent);
  const g = v.gold ? ' gold' : '';
  const hl = C.highlights.map((h,i)=>`
    <article class="hl">
      <img src="${IMG(v.hl[i])}" alt="">
      <div class="veil"></div><span class="num">0${i+1}</span>
      <div class="txt"><h3>${h.t}</h3><p>${h.c}</p></div>
    </article>`).join('');
  const ft = C.features.map((f,i)=>`
    <article class="feat">
      <div class="feat-img"><img src="${IMG(v.ft[i])}" alt=""></div>
      <div>
        <span class="feat-idx">0${i+1} / 0${C.features.length}</span>
        <h3>${f.t}</h3>
        <div class="feat-stat"><b>${f.stat[0]}</b><span>${f.stat[1]}</span></div>
        <p>${f.c}</p>
      </div>
    </article>`).join('');
  const specs = C.specs.map((s,i)=>`
    <div class="spec-row">
      <div class="spec-l"><span class="spec-idx">0${i+1}</span>
        <span class="spec-lab">${s.lab}</span><span class="spec-det">${s.det}</span></div>
      <div class="spec-val">${s.val}<small>${s.unit}</small></div>
    </div>`).join('');
  const gal = v.gal.map((f,i)=>`
    <figure><div class="ph"><img src="${IMG(f)}" alt="" style="object-position:${POS[f]||'50% 50%'}"></div>
      <figcaption><b>0${i+1}</b>${C.gallery[i]?C.gallery[i].cap:'Gallery'}</figcaption></figure>`).join('');

  document.getElementById('page').innerHTML = `
    <header class="hero">
      <img class="hero-img" src="${IMG(v.hero)}" alt="Koenigsegg Gemera">
      <div class="hero-grad"></div>
      <div class="wrap hero-inner">
        <span class="eyebrow"><b>${C.category}</b> ${v.colorway}</span>
        <h1 class="hero-title">${C.brand}<br>${C.title}<span class="dot">.</span></h1>
        <div class="hero-foot">
          <span class="tagline">${C.tagline}</span>
          <span class="price">FROM <b>${C.price}</b></span>
        </div>
      </div>
    </header>

    <section class="sec"><div class="wrap overview">
      <div>
        <span class="eyebrow"><b>${C.category}</b> In the metal</span>
        <h2 class="h2">${C.brand} ${C.title}</h2>
        <p style="color:var(--ash);margin-top:1.5rem;max-width:34rem">${C.desc}</p>
        <div class="cta">
          <a class="btn${g}" href="#">Book a test drive →</a>
          <span class="price">FROM <b>${C.price}</b></span>
        </div>
      </div>
      <div class="photo"><img src="${IMG(v.overview)}" alt=""></div>
    </div></section>

    <section class="sec" style="padding-top:0"><div class="wrap">
      <div class="sec-top">
        <div><span class="eyebrow"><b>Highlights</b> What sets it apart</span>
          <h2 class="h2">The case for the <span class="outline">Gemera</span></h2></div>
        <p>Four things you notice first — in the metal, on the road, and in the way it was built.</p>
      </div>
      <div class="hl-grid">${hl}</div>
    </div></section>

    <section class="sec" style="padding-top:0"><div class="wrap">
      <div class="sec-top">
        <div><span class="eyebrow"><b>Data</b> Specification</span>
          <h2 class="h2">Every <span class="outline">number</span></h2></div>
        <p>The full sheet — what we measure and why it matters on a real road.</p>
      </div>
      <div>${specs}</div>
    </div></section>

    <section class="sec" style="padding-top:0"><div class="wrap">
      <div class="sec-top"><div><span class="eyebrow"><b>Engineering</b> Under the skin</span>
        <h2 class="h2">How it's <span class="outline">made</span></h2></div></div>
      <div>${ft}</div>
    </div></section>

    <section class="sec" style="padding-top:0"><div class="wrap">
      <div class="sec-top"><div><span class="eyebrow"><b>Film</b> In the wild</span>
        <h2 class="h2">Shot on <span class="outline">location</span></h2></div></div>
      <div class="gal">${gal}</div>
    </div></section>

    <section class="track"><div class="wrap">
      <div class="sec-top"><div><span class="eyebrow"><b>Timing</b> On the track</span>
        <h2 class="h2">From the <span class="outline">timing tower</span></h2></div>
        <p>Set on the Veloce test circuit, 4.2 km of everything a road can do to a car.</p></div>
      <div class="track-grid">${C.track.map(t=>`
        <div class="track-item"><div class="k">${t.k}</div><div class="v">${t.v}</div><div class="n">${t.n}</div></div>`).join('')}</div>
    </div></section>

    <a class="next" href="#"><div class="wrap">
      <div><span class="eyebrow">Next in the range</span><span class="nm">${C.next}</span></div>
      <span class="arr">→</span>
    </div></a>`;

  document.getElementById('paltag').textContent = 'Variant: ' + v.colorway;
  window.scrollTo({top:0});
}

// build switcher
const sw = document.getElementById('switch');
V.forEach((v,i)=>{
  const b=document.createElement('button');
  b.textContent=v.name; b.className=(i===0?'on':'')+(v.gold?' gold':'');
  b.onclick=()=>{[...sw.querySelectorAll('button')].forEach(x=>x.classList.remove('on'));b.classList.add('on');render(v);};
  sw.appendChild(b);
});
render(V[0]);
</script>
</body>
</html>
